version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: uav_twin_db
    environment:
      POSTGRES_DB: uav_twin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uav_twin_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/uav_twin
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uav_twin_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
